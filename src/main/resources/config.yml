settings:
  blocks-per-tick: 500 # How many blocks to reset per tick (prevents lag on massive mines)
  auto-reset-percentage: 80.0 # Resets automatically when 80% empty

hologram:
  enabled: true
  height-offset: 3.0 # Blocks above the exact center of the mine
  lines:
    - "&e&l%mine% Mine"
    - "&7Resets in: &c%time%"
    - "&7Mined: &a%mined%&8/&a%total% &8(&e%percent%%&8)"